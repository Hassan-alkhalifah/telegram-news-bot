    min_score: 1
    big_names: [OpenAI, ChatGPT, GPT, Anthropic, Claude, Google, Gemini, DeepMind, Meta, Llama, Microsoft, Copilot, Nvidia, Apple Intelligence, xAI, Grok, Mistral, DeepSeek, Sam Altman, Elon Musk]
