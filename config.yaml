# News bot settings. Edit this file to change sources, rules or the look of posts.
# Lines starting with "#" are comments and are ignored.

settings:
  # Most posts the bot sends in one check (it checks every 15 minutes).
  max_posts_per_run: 3

  # Skip stories older than this many hours.
  max_age_hours: 12

  # Longest summary under the title, in characters. Whole sentences are kept when they fit.
  summary_max_chars: 200

  # Seconds to wait between two posts.
  post_delay_seconds: 3

  # How strong a story must be to get posted. Points:
  #   2 for every extra site that reports the same story (the best sign of big news)
  #   1 if the title has a "strong word" (announced, delayed, trailer, ...; see filters below)
  #   1 if it names a big name of its topic (see big_names under each topic)
  # 2 means: reported by 2+ sites, or one site with both a strong word and a big name.
  # A topic can set its own min_score (AI, Anime and Tech use 1: their sites rarely report the same news).
  min_score: 2

  # Stories reported by at least this many sites get the TOP STORY label.
  top_story_min_sources: 3

  # How alike two titles must be (0 to 1) to count as the same story on two sites. 0.5 works well.
  same_story_similarity: 0.5

  # How many days the bot remembers what it already posted. Keep it above max_age_hours.
  state_retention_days: 7

  # Seconds to wait for a news site or Telegram before giving up.
  request_timeout_seconds: 15

# How each post looks.
style:
  # Added at the end of every post, so people who see a forwarded post can find the channel.
  channel_signature: "@sav_news_channel"
  # Shown next to the topic for stories reported by several sites (see top_story_min_sources).
  top_story_label: "TOP STORY"
  # The name on the banner next to the logo.
  brand_name: "SAV NEWS"
  # true: every post gets a branded banner (news photo, headline, logo). false: the plain news photo.
  banner: true
  # Extra hashtags for big names in the story (#Nintendo, #OpenAI). 0 turns them off.
  name_hashtags: 2
  # The two buttons under every post, and the word before the site's name.
  read_button: "Read full story"
  share_button: "Share"
  source_label: "Source"

# The Arabic twin channel. It gets every post translated by Google Gemini (free plan).
# It only runs when the TELEGRAM_ARABIC_CHANNEL_ID and GEMINI_API_KEY secrets are set.
arabic:
  enabled: true
  # The Gemini model that translates. If Google retires it, put a newer free Flash-Lite model here.
  model: gemini-3.5-flash-lite
  # Empty: uses the Arabic channel's @username.
  channel_signature: ""
  top_story_label: "خبر بارز"
  read_button: "اقرأ الخبر كاملاً"
  share_button: "مشاركة"
  source_label: "المصدر"
  digest_title: "🔥 أهم 5 أخبار اليوم"
  weekly_title: "🏆 أهم 10 أخبار الأسبوع"
  poll_question: "ما أهم خبر هذا الأسبوع؟"

# One extra post each evening with the day's biggest stories.
digest:
  enabled: true
  # Local time to send it (the first check after this hour sends it).
  local_hour: 21
  # Your time zone as hours from UTC. Saudi Arabia is 3. The weekly post uses it too.
  utc_offset_hours: 3
  # How many stories to list, and the fewest worth sending a digest for.
  size: 5
  min_stories: 3
  title: "🔥 Today's top 5"

# One post each week with the week's biggest stories, followed by a poll.
weekly:
  enabled: true
  weekday: friday
  local_hour: 20
  size: 10
  min_stories: 3
  title: "🏆 Top 10 of the week"
  poll: true
  poll_question: "Which was the biggest news this week?"
  # How many of the week's top stories are offered as answers.
  poll_options: 5

# The pinned welcome post that lets new readers pick their language (see README, "Language picker").
language_picker:
  text: |-
    Welcome to SAV NEWS: the biggest AI, games, anime and tech news, as it happens.
    Choose your language below.

    أهلاً بك في SAV NEWS: أهم أخبار الذكاء الاصطناعي والألعاب والأنمي والتقنية أولاً بأول.
    اختر لغتك من الأسفل.
  english_button: "English"
  arabic_button: "العربية"

# Rules for what counts as filler and what counts as real news.
# Patterns are regular expressions and ignore upper/lower case.
filters:
  # 18+ and other unwanted subjects. A story is never posted when its title, summary or the site's
  # tags match one of these. The filter reads text only; it cannot look inside photos.
  blocked:
    # sexual content and nudity
    - '\b(sex|sexual\w*|sexy|porn\w*|nsfw|nudes?|nudity|naked(?! snake)|topless|nipples?|boobs?|genitals?|hentai|ecchi|futanari|erotic\w*|onlyfans|fetish\w*|kink\w*|bdsm|incest|orgy|orgies|milfs?|lewd|xxx|r-?18|rule ?34|adults?[- ]only|adult (games?|content|films?|videos?|visual novels?|sites?)|strip ?clubs?|strippers?|playboy|fakku|nutaku|brothels?|prostitut\w*|escort (service|agency|agencies|girls?)s?|lingerie|bikinis?(?! bottom))\b|(?<!\d)18\+'
    # gambling and betting ("bet" alone is left out: "Apple's big bet on AI" is fine)
    - '\b(gambl\w*|casinos?|betting|bookmakers?|sportsbooks?|wager\w*|slot machines?|lotter(y|ies)|poker|roulette|blackjack)\b'
    # alcohol and drugs ("drugs" alone is left out: "AI speeds up drug discovery" is fine)
    # ("Wine" alone is left out: it is also the Linux tool behind Proton gaming)
    - '\b(alcohol\w*|beers?|wine (bars?|tastings?|bottles?|brands?|lists?)|red wine|white wine|whisk(e)?y|vodka|liquor|cocktails?|drunk\w*|brewer(y|ies)|cannabis|marijuana|cocaine|heroin|meth|methamphetamine|opioids?|narcotics?|psychedelics?|lsd|psilocybin|magic mushrooms|vap(e|es|ing)|cigarettes?|tobacco|nicotine|drug dealers?|recreational drugs?|illegal drugs?|overdos\w*)\b'

  # Feed categories that mark filler.
  skip_tags:
    - Features
    - Feature
    - Guides
    - Tips & Guides
    - Reviews
    - Review
    - Opinion
    - Game Diary
    - Deals
    - Podcast
    - Podcasts
    - evergreen
    - evergeen
    - Installer
    - Sponsored
    - Buying Guide

  # Pieces of a link that mark filler.
  skip_url_parts:
    - /features/
    - /feature/
    - /guides/
    - /guide/
    - /deals/
    - /opinion/
    - /podcast
    - /reviews/
    - -review
    - /sponsored/
    - /how-to

  # Titles that are filler: lists, how-tos, explainers, reviews, shopping, columns.
  skip_titles:
    - '^\d+\s+.*\byou(r|[’'']ll|[’'']re)?\b'
    - '^(the\s+)?(top\s+)?\d+\s+(best|excellent|great|biggest|exciting|essential|things|ways|reasons|drawbacks|tips|underrated|scariest|new)\b'
    - '\b(top|best)\s+\d+\b'
    - '^how (to|long|much|many|fast|often|do|does|did)\b'
    - '^what (is|are|we[’'']ve|you|to)\b'
    - '^why (your|you|you[’'']re|so)\b|^why \w+ (is|are) so\b'
    - '\bhere[’'']s (what|how) (to|much|you)\b'
    - '(?-i:\b[Vv]s\.?\s)'
    - '\?\s*$'
    - '\breview\b'
    - '^deals?:|\bdeals\b|\b(on sale|black friday|cyber monday|prime day|coupon|gift card|price drop|lowest price|prices as low as)\b|\bdiscount(ed)?\b'
    - '\bfor \$\d|\bsave \$\d|\d+% off\b'
    - '\bup for pre-?order\b|\bwhere to (buy|pre-?order)\b'
    - '^(talking point|poll|guide|video|countdown|feature|opinion|interview|podcast|quiz|recap|roundup|psa|sponsored|editorial|preview|hands-on|gallery|soapbox)\s*:'
    - '^\S+ daily:|\bovertime \d+|^pixelated \d+|@ work:|^security bite:|^this week in\b|^what we[’'']ve been playing'
    - '^(i|i[’'']m|i[’'']ve|i[’'']d|my)\b'
    - '\b(costumes?|wallpapers|gift guide)\b'

  # Words that mark real news. A title with one of these gets 1 point.
  strong_words:
    - '\b(announc|reveal|unveil|launch|confirm|delay|cancel|leak|acquir|acquisition|lawsuit|layoff|recall|breach|apologi[sz])\w*'
    - '\b(sue[sd]?|ban(s|ned)?|hack(ed|ers)?|laid off|shut(s|ting)? down|ipo|record|dies|died|passes away|passed away)\b'
    - '\brelease date\b|\btrailer\b|\bfirst look\b|\bpremier\w*|\bsequel\b|\bremake\b'
    - '\bseason \d+\b|\b\d+(st|nd|rd|th) (season|part|cour)\b|\bnew season\b|\bgets (an? )?(tv )?anime\b|\banime adaptation\b|\b(film|movie)\b'
    - '\braises? \$|\bfunding\b|\b(billion|trillion)\b|\bstock (crash|plunge|soar)\w*|\bprice (hike|increase|cut)s?\b|\braises? prices?\b'

# Each topic has a hashtag, an emoji shown at the top of its posts, a card suit for its banner badge
# (spade, heart, diamond or club, from the logo), its Arabic name and hashtag, big names, and RSS feeds.
# The same site in two topics counts once when the bot counts how many sites report a story.
# To add a source: add "- name: ..." and "url: ..." lines under "feeds".
# To turn a source off: put "#" in front of its two lines.
topics:
  - name: AI
    hashtag: AI
